# Include in the EXISTING liftwithstack.com TLS server; preserve normal website
# locations/origin. Ensure existing ^~ locations do not override these paths.
location ~ ^(?:/r(?:/|$)|/routine-share-assets/|/\.well-known/apple-app-site-association$) {
    proxy_pass https://motivated-caring-production-04ef.up.railway.app;
    proxy_set_header Host motivated-caring-production-04ef.up.railway.app;
    proxy_ssl_server_name on;
    proxy_ssl_name motivated-caring-production-04ef.up.railway.app;
    proxy_ssl_verify on;
    # Debian/Ubuntu CA bundle; adjust for the edge host's operating system.
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;
    proxy_connect_timeout 10s;
    proxy_read_timeout 20s;
    proxy_intercept_errors off;
    # Bearer IDs must not enter proxy/CDN access or upstream error logs.
    access_log off;
    error_log /dev/null crit;
}
